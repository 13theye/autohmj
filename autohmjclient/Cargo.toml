[package]
name = "autohmj"
authors = ["13th Eye <jjhh@13theye.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "^0.31"
hangeul = "0.4"
rustkorean = "1.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tungstenite = "0.26"

[lib]
name = "autohmj"
path = "src/lib.rs"

[[bin]]
name = "autohmj"
path = "src/main.rs"