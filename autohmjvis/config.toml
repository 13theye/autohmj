# config.toml
[server]
port = 50001

[osc_send]
# OSC receiver's IP address (String)
target_addr = "127.0.0.1"
# OSC receiver's port.
target_port = 45602

[tempo]
bpm = 236

[audience_window]
# The size of the monitoring window.
# Currently scaling to 1/2 of texture resolution
width = 1920
height = 1080

[performer_window]
# The size of the performer window.
width = 1440
height = 810

[grid]
font_size_text = 60
font_size_translation = 40

grid_rows = 11
grid_cols = 8

# margin between screen edges and grid
top_margin = 60
bottom_margin = 60
left_margin = 48
right_margin = 48
# spacing between grids
grid_spacing = 45
# cell size
cell_width = 70
cell_height = 85
# grid lines
grid_line_stroke = 2

[paths]
#paths are relative to executable directory
# directory to save recordings:
output_directory = "frames"
# directory for key.toml: secret keys
auth = "auth"
# directory for gemma.toml: Gemma AI config:
gemma = "gemma"
# path to intro image:
intro_image = "intro.png"

[rendering_main]
texture_width = 3840
texture_height = 2160
# Please don't change these
texture_samples = 1
arc_resolution = 25


[frame_recorder]
# Settings for the frame recorder
# Frame limit of 30000 frames is about 16m40s at 30fps
# Frame limit of 50000 frames is about 13m53s at 60fps
frame_limit = 50000
fps = 30

[translation]
# Enable or disable automatic translation of conversation messages
enabled = false
