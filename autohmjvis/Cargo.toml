[package]
name = "autohmjvis"
authors = ["13th Eye <jjhh@13theye.com>"]
version = "1.1.0"
edition = "2021"

[dependencies]
autohmjcommon = { path = "../autohmjcommon" }
config = "0.15"
deeplx = { version = "1", default-features = false }
futures-util = "0.3"
hangeul = "0.4.0"
rustkorean = "1.1"
nannou = "0.19"
nannou_osc = "0.19"
nnpipe = { path = "../../13thlib/nnpipe" }
prat = { path = "../../13thlib/prat" }
reqwest = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
toml = "0.8"

[lib]
name = "autohmjvis"
path = "src/lib.rs"

[[bin]]
name = "autohmjvis"
path = "src/main.rs"